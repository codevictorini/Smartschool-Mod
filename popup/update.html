<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Smartschool Mod – Update log</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 360px; }

    /* Sneeuw ook hier */
    .snow { position: fixed; top: 0; left: 0; right: 0; pointer-events: none; z-index: 999; display: flex; justify-content: space-around; }
    .snow span { color: #fff; font-size: 11px; opacity: 0; animation: val linear infinite; }
    .snow span:nth-child(1)  { animation-duration: 5.1s; animation-delay: 0.0s; }
    .snow span:nth-child(2)  { animation-duration: 6.3s; animation-delay: 0.6s; }
    .snow span:nth-child(3)  { animation-duration: 4.8s; animation-delay: 1.2s; }
    .snow span:nth-child(4)  { animation-duration: 7.0s; animation-delay: 0.3s; }
    .snow span:nth-child(5)  { animation-duration: 5.5s; animation-delay: 1.8s; }
    .snow span:nth-child(6)  { animation-duration: 6.1s; animation-delay: 0.9s; }
    .snow span:nth-child(7)  { animation-duration: 4.4s; animation-delay: 2.1s; }
    .snow span:nth-child(8)  { animation-duration: 5.9s; animation-delay: 0.4s; }
    .snow span:nth-child(9)  { animation-duration: 7.2s; animation-delay: 1.5s; }
    .snow span:nth-child(10) { animation-duration: 5.0s; animation-delay: 2.8s; }
    .snow span:nth-child(11) { animation-duration: 6.6s; animation-delay: 0.1s; }
    .snow span:nth-child(12) { animation-duration: 4.9s; animation-delay: 3.2s; }

    /* Header */
    .updates-header {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--groen);
      padding: 10px 14px;
    }
    .updates-header a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      flex-shrink: 0;
      transition: background .12s;
    }
    .updates-header a:hover { background: rgba(255,255,255,0.22); }
    .updates-header strong {
      font-family: Georgia, serif;
      font-size: 15px;
      color: #fff;
      flex: 1;
    }
    .updates-header img { border-radius: 3px; }

    /* Lichtjes ook hier */
    .lights {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 5px 6px 3px;
      background: var(--groen);
    }
    .bulb {
      display: inline-block;
      width: 10px; height: 13px;
      border-radius: 50% 50% 45% 45%;
      position: relative;
    }
    .bulb::before {
      content: "";
      position: absolute;
      top: -4px; left: 3px;
      width: 4px; height: 4px;
      background: #888;
      border-radius: 1px;
    }
    .bulb.r { background: #e74c3c; animation: knipperR 1.4s ease-in-out infinite; }
    .bulb.g { background: #27ae60; animation: knipperG 1.7s ease-in-out infinite; animation-delay: .3s; }
    .bulb.y { background: #f1c40f; animation: knipperY 1.5s ease-in-out infinite; animation-delay: .6s; }
    .bulb.b { background: #2980b9; animation: knipperB 1.9s ease-in-out infinite; animation-delay: .1s; }

    /* Content */
    .updates-body {
      padding: 14px 14px 6px;
      background: var(--sneeuw);
    }

    .update-entry {
      padding: 12px 0;
      border-bottom: 1px solid #c8dac0;
    }
    .update-entry:last-child { border-bottom: none; }

    .update-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .update-version {
      font-size: 13px;
      font-weight: 700;
      color: var(--rood);
      font-family: "Courier New", monospace;
    }
    .update-date {
      font-size: 11px;
      color: var(--muted);
    }
    .update-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .badge-major { background: #fdf0ef; color: var(--rood);  border: 1px solid #f5c5c0; }
    .badge-minor { background: #eef5ff; color: #2d5fb8;      border: 1px solid #c0d4f5; }
    .badge-fix   { background: #edfaf3; color: var(--groen); border: 1px solid #b0dcc0; }

    .update-changes {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .update-changes li {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: #1a1a1a;
      line-height: 1.5;
    }
    .change-tag {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 5px;
      flex-shrink: 0;
      margin-top: 2px;
      border-radius: 2px;
    }
    .tag-new    { background: #edfaf3; color: var(--groen); border: 1px solid #b0dcc0; }
    .tag-fix    { background: #eef5ff; color: #2d5fb8;      border: 1px solid #c0d4f5; }
    .tag-remove { background: #fdf0ef; color: var(--rood);  border: 1px solid #f5c5c0; }
    .tag-change { background: #f8f0ff; color: #6b40c4;      border: 1px solid #d8b8f5; }

    /* Onderste balk */
    .updates-footer {
      padding: 10px 14px;
      background: var(--groen);
      border-top: 3px solid var(--goud);
    }
    .back-btn {
      display: block;
      width: 100%;
      background: var(--rood);
      color: #fff;
      border: 2px solid var(--goud);
      padding: 8px;
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background .12s;
    }
    .back-btn:hover { background: var(--rood2); }
  </style>
</head>
<body>

  <div class="snow" aria-hidden="true">
    <span>❄</span><span>❅</span><span>❆</span><span>❄</span><span>❅</span>
    <span>❆</span><span>❄</span><span>❅</span><span>❆</span><span>❄</span>
    <span>❅</span><span>❆</span>
  </div>

  <main>

    <div class="lights" aria-hidden="true">
      <span class="bulb r"></span><span class="bulb g"></span><span class="bulb y"></span>
      <span class="bulb b"></span><span class="bulb r"></span><span class="bulb g"></span>
      <span class="bulb y"></span><span class="bulb b"></span><span class="bulb r"></span>
      <span class="bulb g"></span><span class="bulb y"></span><span class="bulb b"></span>
      <span class="bulb r"></span><span class="bulb g"></span><span class="bulb y"></span>
    </div>

    <div class="updates-header">
      <a href="popup.html" title="Terug">←</a>
      <strong>Update log</strong>
      <img src="../icons/icon48.png" alt="" width="22" height="22" />
    </div>

    <div class="updates-body">

      <div class="update-entry">
        <div class="update-top">
          <span class="update-version">v1.2.0</span>
          <span class="update-date">28 november 2026</span>
          <span class="update-badge badge-major">december-update</span>
        </div>
        <ul class="update-changes">
          <li><span class="change-tag tag-new">Nieuw</span>Fake berichtenteller</li>
          <li><span class="change-tag tag-new">Nieuw</span>Fake meldingenteller</li>
          <li><span class="change-tag tag-new">Nieuw</span>kerstmis thema</li>
        </ul>
      </div>

    </div>

    <div class="updates-footer">
      <a class="back-btn" href="popup.html">← Terug</a>
    </div>

  </main>
</body>
</html>
