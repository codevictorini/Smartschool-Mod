<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Smartschool Mod</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Sneeuwvlokjes -->
  <div class="snow" aria-hidden="true">
    <span>❄</span><span>❅</span><span>❆</span><span>❄</span><span>❅</span>
    <span>❆</span><span>❄</span><span>❅</span><span>❆</span><span>❄</span>
    <span>❅</span><span>❆</span><span>❄</span><span>❅</span><span>❆</span>
  </div>

  <main>

    <!-- Kerstlichtjes -->
    <div class="lights" aria-hidden="true">
      <span class="bulb r"></span><span class="bulb g"></span><span class="bulb y"></span>
      <span class="bulb b"></span><span class="bulb r"></span><span class="bulb g"></span>
      <span class="bulb y"></span><span class="bulb b"></span><span class="bulb r"></span>
      <span class="bulb g"></span><span class="bulb y"></span><span class="bulb b"></span>
      <span class="bulb r"></span><span class="bulb g"></span><span class="bulb y"></span>
    </div>

    <header>
      <div class="header-left">
        <img src="../icons/icon48.png" alt="" width="26" height="26" />
        <strong>Smartschool Mod</strong>
      </div>
      <div class="header-btns">
        <button class="btn-icon" id="btnUpdates" title="Updates">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="btn-icon" id="btnGithub" title="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.341-3.369-1.341-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
        </button>
        <button class="btn-icon" id="btnDiscord" title="Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="victorini-banner">
      Gemaakt door <strong>victorini</strong> &nbsp;🎁
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="profiel" role="tab">Profiel</button>
      <button class="tab" data-tab="kleuren" role="tab">Kleuren</button>
      <button class="tab" data-tab="geavanceerd" role="tab">Geavanceerd</button>
    </div>

    <!-- TAB: Profiel -->
    <section class="tab-content active" id="tab-profiel">

      <p class="eyebrow">Weergavenaam</p>
      <input type="text" id="displayName" placeholder="Jouw naam..." maxlength="60" />

      <p class="eyebrow">Profielfoto</p>
      <div class="avatar-row">
        <div class="avatar-wrap">
          <span id="avatarPlaceholder">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="4" stroke="#b0b8c8" stroke-width="1.6"/>
              <path d="M4 21a8 8 0 0 1 16 0" stroke="#b0b8c8" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <img id="avatarImg" src="" alt="" style="display:none;" />
        </div>
        <div class="avatar-btns">
          <button class="btn-outline" id="btnUploadAvatar">Uploaden</button>
          <button class="btn-outline" id="btnUrlAvatar">URL</button>
          <button class="btn-link-danger" id="btnClearAvatar">Reset</button>
        </div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none;" />
      <input type="text" id="avatarUrl" placeholder="https://..." style="display:none;margin-top:4px;" />

      <p class="eyebrow">Paginatitel</p>
      <input type="text" id="customTitle" placeholder="bv. Mijn School" maxlength="80" />

      <p class="eyebrow">Berichten &amp; notificaties</p>
      <div class="counter-grid">
        <div class="counter-row">
          <label class="counter-label">✉️ Berichten</label>
          <input type="number" id="fakeMessages" min="0" max="9999" placeholder="—" />
        </div>
        <div class="counter-row">
          <label class="counter-label">🔔 Notificaties</label>
          <input type="number" id="fakeNotifications" min="0" max="9999" placeholder="—" />
        </div>
      </div>
      <p class="field-hint">Laat leeg voor de originele waarde.</p>

      <p class="eyebrow">Favicon</p>
      <div class="favicon-row">
        <div class="favicon-preview" id="faviconPreview">
          <img id="faviconImg" src="" alt="" style="display:none;" />
          <span id="faviconPlaceholder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke="#b0b8c8" stroke-width="1.6"/>
              <path d="M8 12h8M12 8v8" stroke="#b0b8c8" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
        <div class="favicon-btns">
          <button class="btn-outline" id="btnFaviconMod">Mod-logo</button>
          <button class="btn-outline" id="btnFaviconUpload">Uploaden</button>
          <button class="btn-link-danger" id="btnFaviconReset">Reset</button>
        </div>
      </div>
      <input type="file" id="faviconFile" accept="image/*" style="display:none;" />

    </section>

    <!-- TAB: Kleuren -->
    <section class="tab-content" id="tab-kleuren">

      <p class="eyebrow">Topbalk</p>
      <div class="color-row">
        <input type="color" id="navColor" value="#ff520e" />
        <span class="color-hex" id="navColorHex">#ff520e</span>
        <button class="btn-link" id="btnResetNav">Reset</button>
      </div>
      <div class="presets" id="navPresets">
        <button class="preset" data-color="#ff520e" style="background:#ff520e" title="Smartschool"></button>
        <button class="preset" data-color="#1677a8" style="background:#1677a8" title="Oceaan"></button>
        <button class="preset" data-color="#39724b" style="background:#39724b" title="Bos"></button>
        <button class="preset" data-color="#7562a8" style="background:#7562a8" title="Lavendel"></button>
        <button class="preset" data-color="#b9516b" style="background:#b9516b" title="Roos"></button>
        <button class="preset" data-color="#465466" style="background:#465466" title="Leisteen"></button>
        <button class="preset" data-color="#267768" style="background:#267768" title="Mint"></button>
        <button class="preset" data-color="#37689a" style="background:#37689a" title="Hemelsblauw"></button>
        <button class="preset" data-color="#a94b36" style="background:#a94b36" title="Zonsondergang"></button>
        <button class="preset" data-color="#80651a" style="background:#80651a" title="Vanille"></button>
        <button class="preset" data-color="#704d70" style="background:#704d70" title="Pruim"></button>
        <button class="preset" data-color="#3f4b57" style="background:#3f4b57" title="Grafiet"></button>
        <button class="preset" data-color="#176d78" style="background:#176d78" title="Lagune"></button>
        <button class="preset" data-color="#ad6335" style="background:#ad6335" title="Perzik"></button>
      </div>

      <p class="eyebrow">Achtergrond</p>
      <div class="color-row">
        <input type="color" id="bgColor" value="#f6f7f8" />
        <span class="color-hex" id="bgColorHex">#f6f7f8</span>
        <button class="btn-link" id="btnResetBg">Reset</button>
      </div>
      <div class="presets" id="bgPresets">
        <button class="preset" data-color="#f6f7f8" style="background:#f6f7f8" title="Standaard"></button>
        <button class="preset" data-color="#eef6f9" style="background:#eef6f9" title="Oceaan"></button>
        <button class="preset" data-color="#f0f5f0" style="background:#f0f5f0" title="Bos"></button>
        <button class="preset" data-color="#f5f2fa" style="background:#f5f2fa" title="Lavendel"></button>
        <button class="preset" data-color="#fbf1f3" style="background:#fbf1f3" title="Roos"></button>
        <button class="preset" data-color="#f1f3f5" style="background:#f1f3f5" title="Leisteen"></button>
        <button class="preset" data-color="#edf8f4" style="background:#edf8f4" title="Mint"></button>
        <button class="preset" data-color="#eef5fc" style="background:#eef5fc" title="Hemelsblauw"></button>
        <button class="preset" data-color="#fff2eb" style="background:#fff2eb" title="Zonsondergang"></button>
        <button class="preset" data-color="#fff9e7" style="background:#fff9e7" title="Vanille"></button>
        <button class="preset" data-color="#f7f0f7" style="background:#f7f0f7" title="Pruim"></button>
        <button class="preset" data-color="#f0f2f4" style="background:#f0f2f4" title="Grafiet"></button>
        <button class="preset" data-color="#edf7f8" style="background:#edf7f8" title="Lagune"></button>
        <button class="preset" data-color="#fff4ea" style="background:#fff4ea" title="Perzik"></button>
      </div>

      <p class="eyebrow">Lettertype</p>
      <select id="fontFamily">
        <option value="">Standaard (Smartschool)</option>
        <option value="arial">Arial</option>
        <option value="georgia">Georgia</option>
        <option value="verdana">Verdana</option>
        <option value="trebuchet">Trebuchet MS</option>
        <option value="times">Times New Roman</option>
        <option value="monospace">Monospace</option>
      </select>

    </section>

    <!-- TAB: Geavanceerd -->
    <section class="tab-content" id="tab-geavanceerd">

      <p class="eyebrow">Eigen CSS</p>
      <textarea id="customCSS" rows="5" placeholder="/* Schrijf hier je eigen CSS */"></textarea>

      <p class="eyebrow">Elementen verbergen</p>
      <div id="hideList"></div>
      <div class="hide-add-row">
        <input type="text" id="hideSelector" placeholder=".smsc_nav, #footer..." />
        <button class="btn-outline" id="btnAddHide">Voeg toe</button>
      </div>
      <button class="btn-pick" id="btnPickElement">🎯 Klik op een element</button>

      <div class="danger-zone">
        <button class="btn-danger" id="btnReset">Alles resetten</button>
      </div>

    </section>

    <div class="apply-bar">
      <button class="btn-apply" id="btnApply">Toepassen</button>
      <span class="status" id="status"></span>
      <a class="btn-review" id="btnReview" href="#" target="_blank">⭐ Review achterlaten</a>
    </div>

  </main>
  <script src="popup.js"></script>
</body>
</html>
