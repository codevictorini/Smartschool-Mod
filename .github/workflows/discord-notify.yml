name: github update

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, closed, reopened]
  release:
    types: [published]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true

    steps:
      - name: Push notification
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚀 **Nieuwe push** naar `${{ github.ref_name }}`
            **Repo:** ${{ github.repository }}
            **Door:** ${{ github.actor }}
            **Commit:** ${{ github.event.head_commit.message }}
            **Link:** ${{ github.event.head_commit.url }}

      - name: Pull request notification
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🔀 **Pull Request ${{ github.event.action }}**
            **Titel:** ${{ github.event.pull_request.title }}
            **Door:** ${{ github.actor }}
            **Branch:** `${{ github.head_ref }}` → `${{ github.base_ref }}`
            **Link:** ${{ github.event.pull_request.html_url }}

      - name: Release notification
        if: github.event_name == 'release'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🎉 **Nieuwe release: ${{ github.event.release.tag_name }}**
            **Naam:** ${{ github.event.release.name }}
            **Door:** ${{ github.actor }}
            **Link:** ${{ github.event.release.html_url }}

      - name: Issue notification
        if: github.event_name == 'issues'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🐛 **Issue ${{ github.event.action }}**
            **Titel:** ${{ github.event.issue.title }}
            **Door:** ${{ github.actor }}
            **Link:** ${{ github.event.issue.html_url }}
